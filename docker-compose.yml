version: '3.8'

services:

  ####################
  # ZOOKEEPER
  ####################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - kafka-network

  ####################
  # KAFKA
  ####################
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kafka-network

  ####################
  # EUREKA SERVER
  ####################
  eureka-server:
    build: ./BACKEND/service-registry
    container_name: eureka-server
    ports:
      - "8767:8767"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - backend

  ####################
  # CLOUD GATEWAY
  ####################
  cloud-gateway:
    build: ./BACKEND/cloud-gateway
    container_name: cloud-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8767/eureka
    depends_on:
      - kafka
      - eureka-server
    networks:
      - frontend
      - backend
      - kafka-network

  ####################
  # MS MOUVEMENT
  ####################
  ms-mouvement:
    build: ./BACKEND/ms_mouvement
    container_name: ms-mouvement
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8087
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8767/eureka
    depends_on:
      - kafka
      - eureka-server
    networks:
      - backend
      - kafka-network

  ####################
  # MS VEHICULE
  ####################
  ms-vehicule:
    build: ./BACKEND/ms_vehicule
    container_name: ms-vehicule
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8767/eureka
    depends_on:
      - kafka
      - eureka-server
    networks:
      - backend
      - kafka-network

  ####################
  # MS CONTENEUR
  ####################
  ms-conteneur:
    build: ./BACKEND/ms_conteneur
    container_name: ms-conteneur
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8767/eureka
    depends_on:
      - kafka
      - eureka-server
    networks:
      - backend
      - kafka-network

  ####################
  # MS PERSONNE
  ####################
  ms-personne:
    build: ./BACKEND/ms_personne
    container_name: ms-personne
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8767/eureka
    depends_on:
      - kafka
      - eureka-server
    networks:
      - backend
      - kafka-network

networks:
  kafka-network:
    driver: bridge
  backend:
    driver: bridge
  frontend:
    driver: bridge
